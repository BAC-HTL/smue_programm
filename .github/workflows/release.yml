name: Release

# Ein Release entsteht automatisch, wenn auf main eine neue Version in package.json steht.
# Der Workflow legt dabei auch das Tag vX.Y.Z an.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v gibt es schon."
            echo "neu=nein" >> "$GITHUB_OUTPUT"
          else
            echo "neu=ja" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.neu == 'ja'
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.neu == 'ja'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - if: steps.v.outputs.neu == 'ja'
        run: npm ci && npx playwright install --with-deps chromium
      - if: steps.v.outputs.neu == 'ja'
        run: npm run build
      - if: steps.v.outputs.neu == 'ja'
        run: npm test
      - name: Release-Notizen aus CHANGELOG.md
        if: steps.v.outputs.neu == 'ja'
        run: |
          v=$(node -p "require('./package.json').version")
          awk -v v="$v" '/^## /{p = (index($0, "## " v " ") == 1 || $0 == "## " v); next} p' CHANGELOG.md > notizen.md
          node -e "const d=require('./tests/ergebnisse.json');require('fs').appendFileSync('notizen.md','\n**Tests:** '+(d.gesamt-d.fehler)+' von '+d.gesamt+' bestanden. Bericht: https://bac-htl.github.io/smue_programm/tests.html\n')"
          cp tests/ergebnisse.json Testergebnisse.json
      - name: Release und Tag anlegen
        if: steps.v.outputs.neu == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/Smue-Programm.html Testergebnisse.json \
            --target "$GITHUB_SHA" --title "Smü-Programm ${{ steps.v.outputs.tag }}" --notes-file notizen.md
